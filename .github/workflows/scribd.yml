name: Scribd Saudi Construction Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Files
        run: |
          pwd
          ls -la

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright
          playwright install chromium
          playwright install-deps

      - name: Run Scraper
        run: |
          python scribd.py

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saudi-construction-csv
          path: output/saudi_construction_companies.csv
          if-no-files-found: ignore

      - name: Upload Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saudi-construction-excel
          path: output/saudi_construction_companies.xlsx
          if-no-files-found: ignore
