name: Scribd Saudi Construction Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Files
        run: |
          echo "Current Directory:"
          pwd
          echo ""
          echo "Repository Files:"
          ls -lah

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Verify Playwright Installation
        run: |
          python --version
          playwright --version

      - name: Run Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Starting scraper..."
          python -u scribd.py

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            *.png
            *.html
            *.log
          if-no-files-found: ignore

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saudi-construction-csv
          path: output/saudi_construction_companies.csv
          if-no-files-found: ignore

      - name: Upload Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saudi-construction-excel
          path: output/saudi_construction_companies.xlsx
          if-no-files-found: ignore
